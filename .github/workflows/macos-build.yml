name: macOS build

# Build a UNIVERSAL TapeXPlayer.app (arm64 + x86_64) on a macos-15 runner.
# The runner is Apple Silicon (arm64 deps in /opt/homebrew); we add an x86_64
# Homebrew in /usr/local via Rosetta so `make bundle-universal` can build both
# slices and lipo them together — exactly the makefile's own universal flow.
# NOTE: macOS runner minutes bill ~10x and this does two full builds. Trim the
# trigger to workflow_dispatch only if it's too costly.

on:
  push:
    branches: [ stable, unstable, main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ stable, unstable, main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15        # Apple Silicon; Xcode 16+ so Apple clang accepts -std=c++23
    env:
      # openssl@3 is keg-only; cover BOTH arch prefixes so each sub-build finds
      # -lssl/-lcrypto (arm64 from /opt/homebrew, x86_64 from /usr/local).
      LIBRARY_PATH: /opt/homebrew/opt/openssl@3/lib:/usr/local/opt/openssl@3/lib
      CPATH: /opt/homebrew/opt/openssl@3/include:/usr/local/opt/openssl@3/include
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        # The makefile hardcodes -std=c++23; older Apple clang only knows c++2b.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install Rosetta (needed to run the x86_64 Homebrew)
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install arm64 dependencies (/opt/homebrew)
        run: brew install sdl2 sdl2_ttf portaudio ffmpeg openssl@3 rtmidi

      - name: Install x86_64 Homebrew + dependencies (/usr/local)
        run: |
          arch -x86_64 /bin/bash -c \
            'NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"'
          arch -x86_64 /usr/local/bin/brew install sdl2 sdl2_ttf portaudio ffmpeg openssl@3 rtmidi

      # Guard: the code is pure SDL2. Homebrew has been migrating sdl2_ttf/ffmpeg
      # to link against SDL3, which then leaks into the bundle via bundle_libs.sh
      # and makes the shipped .app crash at launch ("SDL3 not found"). Fail fast
      # HERE — at install time — if any dylib that will be bundled references
      # libSDL3, instead of letting a broken universal binary reach users.
      - name: Guard against SDL3 contamination (both arches)
        run: |
          set -euo pipefail
          fail=0
          check() {           # $1 = human label, $2 = glob of dylibs to inspect
            local label="$1"; shift
            for f in "$@"; do
              [ -f "$f" ] || continue
              if otool -L "$f" 2>/dev/null | grep -qi 'libSDL3'; then
                echo "❌  $label: $f links libSDL3 — Homebrew pulled SDL3 in."
                otool -L "$f" | grep -i sdl || true
                fail=1
              fi
            done
          }
          # arm64 (/opt/homebrew) and x86_64 (/usr/local): sdl2_ttf is the prime
          # suspect, ffmpeg av* libs are secondary.
          check "arm64 sdl2_ttf"  /opt/homebrew/opt/sdl2_ttf/lib/libSDL2_ttf*.dylib
          check "x86_64 sdl2_ttf" /usr/local/opt/sdl2_ttf/lib/libSDL2_ttf*.dylib
          check "arm64 ffmpeg"    /opt/homebrew/opt/ffmpeg/lib/libav*.dylib /opt/homebrew/opt/ffmpeg/lib/libsw*.dylib
          check "x86_64 ffmpeg"   /usr/local/opt/ffmpeg/lib/libav*.dylib   /usr/local/opt/ffmpeg/lib/libsw*.dylib
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "⚠️  SDL3 leaked in. Rebuilding sdl2_ttf from source against SDL2…"
            # Rebuilding from source forces sdl2_ttf to link the SDL2 already
            # installed above, instead of using a bottle pre-linked to SDL3.
            brew reinstall --build-from-source sdl2_ttf || true
            arch -x86_64 /usr/local/bin/brew reinstall --build-from-source sdl2_ttf || true
            # Re-verify; if it STILL links SDL3, fail hard (don't ship a crasher).
            fail=0
            check "arm64 sdl2_ttf (post-rebuild)"  /opt/homebrew/opt/sdl2_ttf/lib/libSDL2_ttf*.dylib
            check "x86_64 sdl2_ttf (post-rebuild)" /usr/local/opt/sdl2_ttf/lib/libSDL2_ttf*.dylib
            check "arm64 ffmpeg"    /opt/homebrew/opt/ffmpeg/lib/libav*.dylib
            check "x86_64 ffmpeg"   /usr/local/opt/ffmpeg/lib/libav*.dylib
            if [ "$fail" -ne 0 ]; then
              echo "❌  SDL3 still present after rebuild. The app is SDL2-only; aborting."
              exit 1
            fi
            echo "✅  Rebuild fixed it — no SDL3 linkage remains."
          else
            echo "✅  No SDL3 linkage in sdl2_ttf / ffmpeg on either arch."
          fi

      - name: Show toolchain
        run: |
          clang --version | head -1
          swiftc --version | head -1

      - name: Build universal .app (arm64 + x86_64)
        working-directory: source
        run: make -j"$(sysctl -n hw.ncpu)" bundle-universal SKIP_INSTALL=1

      - name: Verify universal binary
        run: |
          BIN=builds/TapeXPlayer.app/Contents/MacOS/TapeXPlayer
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q arm64
          lipo -info "$BIN" | grep -q x86_64

      - name: Zip .app
        working-directory: builds
        run: ditto -c -k --keepParent TapeXPlayer.app TapeXPlayer-mac-universal.zip

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapeXPlayer-mac-universal
          path: builds/TapeXPlayer-mac-universal.zip
          if-no-files-found: error

      - name: Upload universal binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapeXPlayer-mac-universal-bin
          path: builds/TapeXPlayer.app/Contents/MacOS/TapeXPlayer
          if-no-files-found: ignore
