name: Windows x64 build

# Build TapeXPlayer.exe on a GitHub-hosted windows-latest runner using MSYS2/UCRT64.
# Produces a self-contained bundle (exe + DLLs) as a downloadable artifact, and —
# when triggered by a version tag (v*) — attaches the release zip to a GitHub Release.

on:
  push:
    # feat/** builds too: a feature branch is exactly where a Windows-only regression
    # needs catching, and Windows can't be tested locally from a macOS dev machine.
    branches: [ stable, unstable, main, master, 'feat/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ stable, unstable, main, master ]
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}    # every run: step executes inside the MSYS2 UCRT64 login shell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # UCRT64: MSYS2 no longer carries rtmidi for the older MINGW64 environment
      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # Package list mirrors the makefile's LIBS + toolchain.
          install: >-
            make
            zip
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-portaudio
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-rtmidi
            mingw-w64-ucrt-x86_64-nsis

      # MSYS2 now ships sdl2-compat (a shim that loads SDL3 when the player starts) under the SDL2
      # name, and ffmpeg pulls it in. The player is released with real SDL2, as on macOS: built
      # from source over the shim.
      - name: Build real SDL2 + SDL2_ttf from source
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          git clone --depth 1 --branch release-2.32.10 https://github.com/libsdl-org/SDL     "$WORK/SDL"
          git clone --depth 1 --branch release-2.24.0  https://github.com/libsdl-org/SDL_ttf "$WORK/SDL_ttf"
          cmake -S "$WORK/SDL" -B "$WORK/b-sdl" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" -DSDL_SHARED=ON -DSDL_TEST=OFF
          cmake --build "$WORK/b-sdl"
          cmake --install "$WORK/b-sdl"
          cmake -S "$WORK/SDL_ttf" -B "$WORK/b-ttf" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$MINGW_PREFIX" -DCMAKE_PREFIX_PATH="$MINGW_PREFIX" \
            -DBUILD_SHARED_LIBS=ON -DSDL2TTF_SAMPLES=OFF -DSDL2TTF_VENDORED=OFF -DSDL2TTF_HARFBUZZ=OFF
          cmake --build "$WORK/b-ttf"
          cmake --install "$WORK/b-ttf"
          # Fail here, not on a user's computer, if the shim is still what gets linked and bundled
          for dll in SDL2.dll SDL2_ttf.dll; do
            test -f "$MINGW_PREFIX/bin/$dll"
            if grep -a -q -i 'SDL3.dll' "$MINGW_PREFIX/bin/$dll"; then echo "$dll is the sdl2-compat shim"; exit 1; fi
          done

      - name: Show toolchain
        run: |
          echo "MSYSTEM=$MSYSTEM  PREFIX=$MSYSTEM_PREFIX"
          g++ --version | head -1
          make --version | head -1

      - name: Build
        working-directory: source
        run: make -j2 FREEZE_BUILD_NUMBER=1   # pin to committed .build_number (same on every platform)

      - name: Bundle DLLs
        working-directory: source
        run: ./bundle_dlls.sh

      - name: Create release zip
        working-directory: source
        run: ./create_win_release.sh || echo "release script skipped/failed (non-fatal)"

      - name: Build NSIS installer
        working-directory: source
        run: ./create_win_installer.sh x64

      - name: Verify build output
        run: |
          ls -la builds/binaries/ || true
          ls -la builds/win-bundle/ || true
          test -f builds/win-bundle/TapeXPlayer.exe

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapeXPlayer-win-x64
          path: builds/win-bundle/
          if-no-files-found: error

      - name: Upload release zip + installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapeXPlayer-win-release
          path: |
            builds/*.zip
            builds/TapeXPlayer-Setup-*.exe
          if-no-files-found: ignore

      # No GitHub Release is created or modified by this workflow.
      # The zip and NSIS installer are available as downloadable artifacts above
      # (Actions run page -> Artifacts). Publish releases manually when ready.
